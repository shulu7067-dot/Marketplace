<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact us — Marka</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/listing.css" />
    <link rel="stylesheet" href="css/sell.css" />
    <link rel="stylesheet" href="css/modal.css" />
    <link rel="stylesheet" href="css/contact.css" />
  </head>
  <body>
    <div class="page">
      <div class="shell">

        <!-- Mobile / tablet top bar -->
        <header class="topbar topbar--mobile">
          <button class="icon-btn" id="menuBtn" aria-label="Menu">
            <i data-lucide="menu"></i>
          </button>
          <div class="brand">
            <span class="brand-mark">M</span>
            <span class="brand-name">Marka</span>
          </div>
          <a class="icon-btn icon-btn--dot" data-notif-bell href="notifications.html" aria-label="Notifications">
            <i data-lucide="bell"></i>
          </a>
        </header>

        <!-- Desktop / laptop top nav -->
        <header class="topbar topbar--desktop">
          <div class="brand">
            <span class="brand-mark brand-mark--lg">M</span>
            <span class="brand-name brand-name--lg">Marka</span>
          </div>
          <nav class="nav-links" id="navLinks"></nav>
          <div class="topbar-actions">
            <a class="icon-btn icon-btn--dot" id="notificationsBtn" data-notif-bell href="notifications.html" aria-label="Notifications">
              <i data-lucide="bell"></i>
            </a>
            <a class="icon-btn" id="messagesBtn" href="messages.html" aria-label="Messages">
              <i data-lucide="message-circle"></i>
            </a>
            <a class="post-ad-btn" href="sell.html">
              <i data-lucide="plus" class="accent-icon"></i> Post ad
            </a>
            <a class="avatar" href="profile.html" aria-label="Your profile">JD</a>
          </div>
        </header>

        <!-- Breadcrumb -->
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a>
          <i data-lucide="chevron-right"></i>
          <span aria-current="page">Contact</span>
        </nav>

        <!-- Heading -->
        <div class="contact-heading">
          <h1 class="contact-page-title">Get in touch</h1>
          <p class="contact-page-subtitle">Questions about a trade, a listing, or your account? We're happy to help.</p>
        </div>

        <section class="section section--latest">
          <!-- Quick info -->
          <div class="contact-info-row">
            <div class="contact-info-card">
              <div class="contact-info-icon"><i data-lucide="mail"></i></div>
              <div>
                <p class="contact-info-label">Email support</p>
                <p class="contact-info-value">support@marka.example</p>
              </div>
            </div>
            <div class="contact-info-card">
              <div class="contact-info-icon"><i data-lucide="clock"></i></div>
              <div>
                <p class="contact-info-label">Response time</p>
                <p class="contact-info-value">Within 1 business day</p>
              </div>
            </div>
            <div class="contact-info-card">
              <div class="contact-info-icon"><i data-lucide="map-pin"></i></div>
              <div>
                <p class="contact-info-label">Based in</p>
                <p class="contact-info-value">New York, NY</p>
              </div>
            </div>
          </div>

          <!-- Form -->
          <form class="contact-form-card" id="contactForm" novalidate>
            <div class="contact-form-row">
              <div class="form-group">
                <label class="form-label" for="contactName">Name</label>
                <input class="form-input" type="text" id="contactName" name="name" placeholder="Your name" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="contactEmail">Email</label>
                <input class="form-input" type="email" id="contactEmail" name="email" placeholder="you@example.com" required />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="contactSubject">What's this about?</label>
              <select class="form-select" id="contactSubject" name="subject" required>
                <option value="">Choose a topic</option>
                <option value="account">Account & login</option>
                <option value="listing">A listing or an order</option>
                <option value="safety">Report a safety concern</option>
                <option value="billing">Billing & boosts</option>
                <option value="other">Something else</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="contactMessage">Message</label>
              <textarea class="form-textarea" id="contactMessage" name="message" placeholder="Tell us what's going on…" required></textarea>
            </div>

            <button type="submit" class="post-ad-btn contact-submit-btn">
              <i data-lucide="send"></i> Send message
            </button>
          </form>
        </section>

        <!-- Bottom nav (mobile & tablet only) -->
        <nav class="bottom-nav" id="bottomNav"></nav>
      </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/analytics-store.js"></script>
    <script src="js/favorites-store.js"></script>
    <script src="js/messages-data.js"></script>
    <script src="js/messages-store.js"></script>
    <script src="js/notifications-data.js"></script>
    <script src="js/notifications-store.js"></script>
    <script src="js/contact.js"></script>
  </body>
</html>
