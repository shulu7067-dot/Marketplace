<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages — Marka</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/listing.css" />
    <link rel="stylesheet" href="css/messages.css" />
  </head>
  <body class="chat-page">
    <div class="page">
      <div class="shell">

        <!-- Mobile / tablet top bar -->
        <header class="topbar topbar--mobile">
          <button class="icon-btn" id="menuBtn" aria-label="Menu">
            <i data-lucide="menu"></i>
          </button>
          <div class="brand">
            <span class="brand-mark">M</span>
            <span class="brand-name">Marka</span>
          </div>
          <a class="icon-btn icon-btn--dot" data-notif-bell href="notifications.html" aria-label="Notifications">
            <i data-lucide="bell"></i>
          </a>
        </header>

        <!-- Desktop / laptop top nav -->
        <header class="topbar topbar--desktop">
          <div class="brand">
            <span class="brand-mark brand-mark--lg">M</span>
            <span class="brand-name brand-name--lg">Marka</span>
          </div>
          <nav class="nav-links" id="navLinks"></nav>
          <div class="topbar-actions">
            <a class="icon-btn icon-btn--dot" id="notificationsBtn" data-notif-bell href="notifications.html" aria-label="Notifications">
              <i data-lucide="bell"></i>
            </a>
            <a class="icon-btn" id="messagesBtn" href="messages.html" aria-label="Messages">
              <i data-lucide="message-circle"></i>
            </a>
            <a class="post-ad-btn" href="sell.html">
              <i data-lucide="plus" class="accent-icon"></i> Post ad
            </a>
            <a class="avatar" href="profile.html" aria-label="Your profile">JD</a>
          </div>
        </header>

        <!-- Breadcrumb -->
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a>
          <i data-lucide="chevron-right"></i>
          <span aria-current="page">Messages</span>
        </nav>

        <!-- Chat shell: thread list + active conversation -->
        <div class="msg-shell" id="msgShell">

          <!-- Thread list -->
          <div class="msg-sidebar">
            <div class="msg-search">
              <div class="msg-search-field">
                <i data-lucide="search" class="msg-search-icon"></i>
                <input type="text" id="msgSearchInput" placeholder="Search conversations…" aria-label="Search conversations" />
              </div>
            </div>
            <div class="msg-thread-list" id="msgThreadList"></div>
          </div>

          <!-- Active conversation -->
          <div class="msg-panel">
            <div class="msg-panel-empty" id="msgPanelEmpty">
              <i data-lucide="message-circle"></i>
              <p>Select a conversation, or message a seller from any listing to start one.</p>
            </div>

            <div id="msgPanelActive" style="display:none; flex-direction:column; flex:1; min-height:0;">
              <div class="msg-chat-header">
                <button class="msg-back-btn" id="msgBackBtn" aria-label="Back to conversations">
                  <i data-lucide="arrow-left"></i>
                </button>
                <div class="msg-avatar-wrap">
                  <div class="msg-avatar" id="msgChatAvatar"></div>
                </div>
                <div class="msg-chat-header-info">
                  <div class="msg-chat-header-name" id="msgChatName"></div>
                  <div class="msg-chat-header-status" id="msgChatStatus"></div>
                </div>
                <button class="msg-block-btn" id="msgBlockBtn" type="button" aria-label="Block user">
                  <i data-lucide="user-x"></i>
                </button>
              </div>

              <a class="msg-listing-banner" id="msgChatListing" href="listing.html">
                <div class="msg-listing-banner-thumb" id="msgChatListingThumb"></div>
                <div class="msg-listing-banner-text">
                  <div class="msg-listing-banner-title" id="msgChatListingTitle"></div>
                  <div class="msg-listing-banner-price" id="msgChatListingPrice"></div>
                </div>
                <span class="msg-listing-banner-link">View ad</span>
              </a>

              <div class="msg-scroll" id="msgScroll"></div>

              <div class="msg-typing-row" id="msgTypingRow" style="display:none; padding: 0 16px;">
                <div class="msg-typing-bubble"><span></span><span></span><span></span></div>
              </div>

              <div class="msg-image-preview" id="msgImagePreview">
                <div class="msg-image-preview-thumb" id="msgImagePreviewThumb"></div>
                <span class="msg-image-preview-text">Photo ready to send</span>
                <button class="msg-image-preview-remove" id="msgImagePreviewRemove" aria-label="Remove photo">
                  <i data-lucide="x"></i>
                </button>
              </div>

              <div class="msg-blocked-banner" id="msgBlockedBanner" style="display:none;">
                <i data-lucide="user-x"></i>
                <span>You've blocked this user. Unblock them to send messages.</span>
                <button type="button" id="msgUnblockBtn">Unblock</button>
              </div>

              <div class="msg-composer" id="msgComposer">
                <button class="msg-composer-attach-btn" id="msgAttachBtn" type="button" aria-label="Send a photo">
                  <i data-lucide="image-plus"></i>
                </button>
                <input type="file" id="msgFileInput" accept="image/*" hidden />
                <div class="msg-composer-input-wrap">
                  <textarea class="msg-composer-input" id="msgInput" placeholder="Write a message…" rows="1"></textarea>
                </div>
                <button class="msg-composer-send-btn" id="msgSendBtn" type="button" aria-label="Send" disabled>
                  <i data-lucide="send"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Bottom nav — mobile & tablet only; laptop/desktop use the top nav above -->
        <nav class="bottom-nav" id="bottomNav"></nav>
      </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/currency-data.js"></script>
    <script src="js/messages-data.js"></script>
    <script src="js/messages-store.js"></script>
    <script src="js/notifications-data.js"></script>
    <script src="js/notifications-store.js"></script>
    <script src="js/blocked-users-store.js"></script>
    <script src="js/messages.js"></script>
  </body>
</html>
