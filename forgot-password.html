<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot password — Marka</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/listing.css" />
    <link rel="stylesheet" href="css/sell.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <div class="page">
      <div class="auth-page">
        <a class="auth-back" href="login.html">
          <i data-lucide="arrow-left"></i> Back to log in
        </a>

        <div class="auth-wrap">
          <a class="auth-brand" href="index.html">
            <span class="brand-mark">M</span>
            <span class="brand-name">Marka</span>
          </a>

          <div class="auth-card">
            <!-- Request form -->
            <div id="requestView">
              <div class="auth-head">
                <h1 class="auth-title">Forgot your password?</h1>
                <p class="auth-subtitle">Enter the email on your account and we'll send you a link to reset it.</p>
              </div>

              <form id="forgotForm" novalidate>
                <div class="form-group" id="forgotEmailGroup">
                  <label class="form-label" for="forgotEmail">Email</label>
                  <input class="form-input" type="email" id="forgotEmail" name="email" placeholder="you@example.com" autocomplete="email" required />
                  <div class="form-error"><i data-lucide="alert-circle"></i><span>Enter a valid email address.</span></div>
                </div>

                <button type="submit" class="auth-submit" id="forgotSubmitBtn">
                  <span class="spinner"></span>
                  <i data-lucide="send" class="submit-icon"></i>
                  <span class="submit-label">Send reset link</span>
                </button>
              </form>
            </div>

            <!-- Success state -->
            <div id="successView" class="auth-success" hidden>
              <div class="auth-success-icon"><i data-lucide="mail-check"></i></div>
              <h2 class="auth-success-title">Check your email</h2>
              <p class="auth-success-text">We've sent a password reset link to <strong id="sentToEmail"></strong>. Follow the link to choose a new password.</p>
              <button type="button" class="btn-secondary" id="tryAnotherBtn" style="width:100%; margin-bottom:10px;">
                <i data-lucide="rotate-ccw"></i> Use a different email
              </button>
              <a class="btn-primary" href="login.html" style="width:100%;">
                <i data-lucide="arrow-left"></i> Back to log in
              </a>
            </div>
          </div>

          <p class="auth-foot">Remembered it after all? <a href="login.html">Log in</a></p>
        </div>
      </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/currency-data.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/forgot-password.js"></script>
  </body>
</html>
