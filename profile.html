<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your profile — Marka</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/listing.css" />
    <link rel="stylesheet" href="css/sell.css" />
    <link rel="stylesheet" href="css/profile.css" />
    <link rel="stylesheet" href="css/modal.css" />
  </head>
  <body>
    <div class="page">
      <div class="shell">

        <!-- Mobile / tablet top bar -->
        <header class="topbar topbar--mobile">
          <button class="icon-btn" id="menuBtn" aria-label="Menu">
            <i data-lucide="menu"></i>
          </button>
          <div class="brand">
            <span class="brand-mark">M</span>
            <span class="brand-name">Marka</span>
          </div>
          <a class="icon-btn icon-btn--dot" data-notif-bell href="notifications.html" aria-label="Notifications">
            <i data-lucide="bell"></i>
          </a>
        </header>

        <!-- Desktop / laptop top nav -->
        <header class="topbar topbar--desktop">
          <div class="brand">
            <span class="brand-mark brand-mark--lg">M</span>
            <span class="brand-name brand-name--lg">Marka</span>
          </div>
          <nav class="nav-links" id="navLinks"></nav>
          <div class="topbar-actions">
            <a class="icon-btn icon-btn--dot" id="notificationsBtn" data-notif-bell href="notifications.html" aria-label="Notifications">
              <i data-lucide="bell"></i>
            </a>
            <a class="icon-btn" id="messagesBtn" href="messages.html" aria-label="Messages">
              <i data-lucide="message-circle"></i>
            </a>
            <a class="post-ad-btn" href="sell.html">
              <i data-lucide="plus" class="accent-icon"></i> Post ad
            </a>
            <a class="avatar" href="profile.html" aria-label="Your profile">JD</a>
          </div>
        </header>

        <!-- Breadcrumb -->
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a>
          <i data-lucide="chevron-right"></i>
          <span aria-current="page">Profile</span>
        </nav>

        <!-- Profile header -->
        <section class="profile-header">
          <div class="profile-cover" id="profileCover">
            <button type="button" class="cover-photo-btn" id="coverPhotoBtn" aria-label="Change cover photo">
              <i data-lucide="camera"></i>
            </button>
          </div>
          <div class="profile-identity">
            <div class="profile-avatar-wrap">
              <div class="profile-avatar" id="profileAvatar">JD</div>
              <button type="button" class="avatar-photo-btn" id="avatarPhotoBtn" aria-label="Change profile photo">
                <i data-lucide="camera"></i>
              </button>
            </div>
            <button class="profile-edit-btn" id="editProfileBtn">
              <i data-lucide="pencil"></i> Edit profile
            </button>
          </div>
          <input type="file" id="avatarFileInput" accept="image/*" hidden />
          <input type="file" id="coverFileInput" accept="image/*" hidden />
          <div class="profile-name-row">
            <h1 class="profile-name" id="profileName"></h1>
            <button type="button" class="verified-tag" id="profileVerified"></button>
          </div>
          <div class="profile-meta">
            <span class="profile-meta-item"><i data-lucide="map-pin"></i><span id="profileLoc"></span></span>
            <span class="profile-meta-item"><i data-lucide="calendar"></i><span id="profileSince"></span></span>
            <span class="profile-meta-item seller-rating"><i data-lucide="star"></i><span id="profileRating"></span></span>
          </div>
          <p class="profile-bio" id="profileBio"></p>
        </section>

        <!-- Stats -->
        <section class="section">
          <div class="stats-grid" id="statsGrid"></div>
        </section>

        <!-- Tabs -->
        <section class="section">
          <div class="profile-tabs" id="profileTabs" role="tablist">
            <button class="profile-tab active" data-tab-panel="listings" role="tab" aria-selected="true">My Listings</button>
            <button class="profile-tab" data-tab-panel="favorites" role="tab" aria-selected="false">Saved</button>
            <button class="profile-tab" data-tab-panel="reviews" role="tab" aria-selected="false">Reviews</button>
          </div>

          <!-- Listings panel -->
          <div class="tab-panel" id="panel-listings">
            <div class="listings-panel-head">
              <div class="sub-tabs" id="listingSubTabs" role="tablist" aria-label="Listing status">
                <button class="sub-tab active" data-listing-status="published" role="tab" aria-selected="true">Active</button>
                <button class="sub-tab" data-listing-status="pending" role="tab" aria-selected="false">Pending</button>
                <button class="sub-tab" data-listing-status="sold" role="tab" aria-selected="false">Sold</button>
                <button class="sub-tab" data-listing-status="expired" role="tab" aria-selected="false">Expired</button>
                <button class="sub-tab" data-listing-status="draft" role="tab" aria-selected="false">Drafts</button>
              </div>
              <a class="btn-secondary insights-link-btn" href="insights.html">
                <i data-lucide="bar-chart-3"></i> Insights
              </a>
            </div>
            <div class="listings-grid" id="myListingsGrid"></div>
            <div class="empty-state" id="myListingsEmpty" hidden>
              <i data-lucide="package"></i>
              <p id="myListingsEmptyText"></p>
            </div>
          </div>

          <!-- Saved panel: favorited items + saved searches -->
          <div class="tab-panel" id="panel-favorites" hidden>
            <div class="sub-tabs" id="savedSubTabs" role="tablist" aria-label="Saved">
              <button class="sub-tab active" data-saved-view="items" role="tab" aria-selected="true">Saved items</button>
              <button class="sub-tab" data-saved-view="searches" role="tab" aria-selected="false">Saved searches</button>
            </div>

            <div id="savedItemsView">
              <div class="listings-grid" id="myFavoritesGrid"></div>
              <div class="empty-state" id="favoritesEmpty" hidden>
                <i data-lucide="heart"></i>
                <p>Items you favorite will show up here.</p>
              </div>
            </div>

            <div id="savedSearchesView" hidden>
              <div class="saved-searches-list" id="savedSearchesList"></div>
              <div class="empty-state" id="savedSearchesEmpty" hidden>
                <i data-lucide="bookmark"></i>
                <p>Save a search from the Browse page's filter bar to find it here.</p>
              </div>
            </div>
          </div>

          <!-- Reviews panel -->
          <div class="tab-panel" id="panel-reviews" hidden>
            <div class="rating-summary" id="ratingSummary"></div>
            <div class="reviews-toolbar">
              <span class="reviews-count" id="reviewsCount"></span>
              <div class="sub-tabs sub-tabs--sort" id="reviewsSort" role="tablist" aria-label="Sort reviews">
                <button class="sub-tab active" data-review-sort="recent" role="tab" aria-selected="true">Newest</button>
                <button class="sub-tab" data-review-sort="highest" role="tab" aria-selected="false">Highest rated</button>
                <button class="sub-tab" data-review-sort="lowest" role="tab" aria-selected="false">Lowest rated</button>
              </div>
            </div>
            <div class="reviews-list" id="reviewsList"></div>
          </div>
        </section>

        <!-- Account settings -->
        <section class="section section--latest">
          <div class="section-head">
            <h2 class="section-title">Account</h2>
          </div>
          <div class="settings-list" id="settingsList"></div>
        </section>

        <!-- Bottom nav — mobile & tablet only; laptop/desktop use the top nav above -->
        <nav class="bottom-nav" id="bottomNav"></nav>
      </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/currency-data.js"></script>
    <script src="js/analytics-store.js"></script>
    <script src="js/favorites-store.js"></script>
    <script src="js/messages-data.js"></script>
    <script src="js/messages-store.js"></script>
    <script src="js/notifications-data.js"></script>
    <script src="js/notifications-store.js"></script>
    <script src="js/listing-data.js"></script>
    <script src="js/listings-store.js"></script>
    <script src="js/promotions-store.js"></script>
    <script src="js/blocked-users-store.js"></script>
    <script src="js/saved-searches-store.js"></script>
    <script src="js/profile-data.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
