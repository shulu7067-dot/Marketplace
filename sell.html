<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post an ad — Marka</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/listing.css" />
    <link rel="stylesheet" href="css/sell.css" />
  </head>
  <body>
    <div class="page">
      <div class="shell">

        <!-- Mobile / tablet top bar -->
        <header class="topbar topbar--mobile">
          <button class="icon-btn" id="menuBtn" aria-label="Menu">
            <i data-lucide="menu"></i>
          </button>
          <div class="brand">
            <span class="brand-mark">M</span>
            <span class="brand-name">Marka</span>
          </div>
          <button class="icon-btn icon-btn--dot" aria-label="Notifications">
            <i data-lucide="bell"></i>
          </button>
        </header>

        <!-- Desktop / laptop top nav -->
        <header class="topbar topbar--desktop">
          <div class="brand">
            <span class="brand-mark brand-mark--lg">M</span>
            <span class="brand-name brand-name--lg">Marka</span>
          </div>
          <nav class="nav-links" id="navLinks"></nav>
          <div class="topbar-actions">
            <button class="icon-btn icon-btn--dot" aria-label="Notifications">
              <i data-lucide="bell"></i>
            </button>
            <a class="post-ad-btn" href="sell.html">
              <i data-lucide="plus" class="accent-icon"></i> Post ad
            </a>
            <div class="avatar">JD</div>
          </div>
        </header>

        <!-- Breadcrumb -->
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a>
          <i data-lucide="chevron-right"></i>
          <span aria-current="page">Post an ad</span>
        </nav>

        <main class="sell-main">
          <div class="sell-heading">
            <h1 class="sell-title">Post an ad</h1>
            <p class="sell-subtitle">Add a few details and photos — it takes less than five minutes.</p>
          </div>

          <form id="sellForm">

            <!-- Photos -->
            <section class="form-section">
              <h2 class="form-section-title">Photos</h2>
              <div class="photo-grid" id="photoGrid">
                <button type="button" class="photo-tile photo-tile--cover" id="addPhotoTile">
                  <i data-lucide="camera"></i>
                  <span>Add photo</span>
                </button>
              </div>
              <input type="file" id="photoInput" class="photo-input" accept="image/*" multiple />
              <p class="form-hint">Up to 8 photos. First photo is used as the cover.</p>
            </section>

            <!-- Details -->
            <section class="form-section">
              <h2 class="form-section-title">Details</h2>

              <div class="form-group">
                <label class="form-label" for="adTitle">Title</label>
                <input class="form-input" type="text" id="adTitle" name="title" placeholder="e.g. Trek Marlin 7 mountain bike" required />
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="adCategory">Category</label>
                  <select class="form-select" id="adCategory" name="category" required></select>
                </div>
                <div class="form-group">
                  <label class="form-label" for="adCondition">Condition</label>
                  <select class="form-select" id="adCondition" name="condition" required></select>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="adDescription">Description</label>
                <textarea class="form-textarea" id="adDescription" name="description" placeholder="Describe the item's condition, features, and reason for selling…" required></textarea>
              </div>
            </section>

            <!-- Price & location -->
            <section class="form-section">
              <h2 class="form-section-title">Price &amp; location</h2>

              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="adPrice">Price</label>
                  <div class="form-price-field">
                    <span>$</span>
                    <input type="number" id="adPrice" name="price" min="0" inputmode="numeric" placeholder="0" required />
                  </div>
                </div>
                <div class="form-group">
                  <label class="form-label" for="adLocation">Location</label>
                  <input class="form-input" type="text" id="adLocation" name="location" placeholder="e.g. Brooklyn, US" required />
                </div>
              </div>
            </section>

            <div class="sell-actions">
              <button type="button" class="btn-secondary" id="saveDraftBtn">
                <i data-lucide="save"></i> Save draft
              </button>
              <button type="submit" class="btn-primary">
                <i data-lucide="upload"></i> Post ad
              </button>
            </div>

            <div class="sell-toast" id="sellToast" hidden>
              <i data-lucide="check-circle"></i>
              <span id="sellToastText">Your ad is live.</span>
            </div>
          </form>
        </main>

        <!-- Bottom nav (mobile & tablet only) -->
        <nav class="bottom-nav" id="bottomNav"></nav>
      </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/browse-data.js"></script>
    <script src="js/sell.js"></script>
  </body>
</html>
