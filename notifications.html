<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications — Marka</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/listing.css" />
    <link rel="stylesheet" href="css/notifications.css" />
  </head>
  <body>
    <div class="page">
      <div class="shell">

        <!-- Mobile / tablet top bar -->
        <header class="topbar topbar--mobile">
          <button class="icon-btn" id="menuBtn" aria-label="Menu">
            <i data-lucide="menu"></i>
          </button>
          <div class="brand">
            <span class="brand-mark">M</span>
            <span class="brand-name">Marka</span>
          </div>
          <a class="icon-btn icon-btn--dot" data-notif-bell href="notifications.html" aria-label="Notifications">
            <i data-lucide="bell"></i>
          </a>
        </header>

        <!-- Desktop / laptop top nav -->
        <header class="topbar topbar--desktop">
          <div class="brand">
            <span class="brand-mark brand-mark--lg">M</span>
            <span class="brand-name brand-name--lg">Marka</span>
          </div>
          <nav class="nav-links" id="navLinks"></nav>
          <div class="topbar-actions">
            <a class="icon-btn icon-btn--dot" id="notificationsBtn" data-notif-bell href="notifications.html" aria-label="Notifications">
              <i data-lucide="bell"></i>
            </a>
            <a class="icon-btn" id="messagesBtn" href="messages.html" aria-label="Messages">
              <i data-lucide="message-circle"></i>
            </a>
            <a class="post-ad-btn" href="sell.html">
              <i data-lucide="plus" class="accent-icon"></i> Post ad
            </a>
            <a class="avatar" href="profile.html" aria-label="Your profile">JD</a>
          </div>
        </header>

        <!-- Breadcrumb -->
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a>
          <i data-lucide="chevron-right"></i>
          <span aria-current="page">Notifications</span>
        </nav>

        <section class="section">
          <div class="notif-head">
            <h1 class="notif-title">Notifications</h1>
            <button type="button" class="notif-mark-all-btn" id="notifMarkAllBtn">
              <i data-lucide="check-check"></i> Mark all as read
            </button>
          </div>

          <div class="sub-tabs" id="notifFilterTabs" role="tablist" aria-label="Filter notifications">
            <button class="sub-tab active" data-notif-filter="all" role="tab" aria-selected="true">All</button>
            <button class="sub-tab" data-notif-filter="message" role="tab" aria-selected="false">Messages</button>
            <button class="sub-tab" data-notif-filter="offer" role="tab" aria-selected="false">Offers</button>
            <button class="sub-tab" data-notif-filter="saved-search" role="tab" aria-selected="false">Saved searches</button>
            <button class="sub-tab" data-notif-filter="listing-approved" role="tab" aria-selected="false">Listing approved</button>
            <button class="sub-tab" data-notif-filter="price-change" role="tab" aria-selected="false">Price changes</button>
          </div>

          <div class="notif-list" id="notifList"></div>

          <div class="empty-state" id="notifEmpty" style="display:none;">
            <i data-lucide="bell-off"></i>
            <p>No notifications here yet.</p>
          </div>
        </section>

        <!-- Bottom nav — mobile & tablet only; laptop/desktop use the top nav above -->
        <nav class="bottom-nav" id="bottomNav"></nav>
      </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/messages-data.js"></script>
    <script src="js/messages-store.js"></script>
    <script src="js/notifications-data.js"></script>
    <script src="js/notifications-store.js"></script>
    <script src="js/notifications.js"></script>
  </body>
</html>
