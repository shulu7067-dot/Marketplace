<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favorites — Marka</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/listing.css" />
    <link rel="stylesheet" href="css/browse.css" />
    <link rel="stylesheet" href="css/favorites.css" />
    <link rel="stylesheet" href="css/modal.css" />
  </head>
  <body>
    <div class="page">
      <div class="shell">

        <!-- Mobile / tablet top bar -->
        <header class="topbar topbar--mobile">
          <button class="icon-btn" id="menuBtn" aria-label="Menu">
            <i data-lucide="menu"></i>
          </button>
          <div class="brand">
            <span class="brand-mark">M</span>
            <span class="brand-name">Marka</span>
          </div>
          <a class="icon-btn icon-btn--dot" data-notif-bell href="notifications.html" aria-label="Notifications">
            <i data-lucide="bell"></i>
          </a>
        </header>

        <!-- Desktop / laptop top nav -->
        <header class="topbar topbar--desktop">
          <div class="brand">
            <span class="brand-mark brand-mark--lg">M</span>
            <span class="brand-name brand-name--lg">Marka</span>
          </div>
          <nav class="nav-links" id="navLinks"></nav>
          <div class="topbar-actions">
            <a class="icon-btn icon-btn--dot" id="notificationsBtn" data-notif-bell href="notifications.html" aria-label="Notifications">
              <i data-lucide="bell"></i>
            </a>
            <a class="icon-btn" id="messagesBtn" href="messages.html" aria-label="Messages">
              <i data-lucide="message-circle"></i>
            </a>
            <a class="post-ad-btn" href="sell.html">
              <i data-lucide="plus" class="accent-icon"></i> Post ad
            </a>
            <a class="avatar" href="profile.html" aria-label="Your profile">JD</a>
          </div>
        </header>

        <!-- Breadcrumb -->
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a>
          <i data-lucide="chevron-right"></i>
          <span aria-current="page">Favorites</span>
        </nav>

        <section class="section">
          <div class="fav-head">
            <h1 class="fav-title">Your favorites</h1>
            <button type="button" class="fav-clear-btn" id="favClearAllBtn">
              <i data-lucide="trash-2"></i> Clear all
            </button>
          </div>

          <div class="fav-subhead">
            <div class="fav-count" id="favCount" aria-live="polite"></div>
            <label class="fav-sort-label" for="favSort">
              Sort by
              <select class="filter-select" id="favSort" aria-label="Sort favorites"></select>
            </label>
          </div>

          <div class="listings-grid" id="favGrid"></div>

          <div class="empty-state" id="favEmpty" hidden>
            <div class="empty-illustration"><i data-lucide="heart"></i></div>
            <h3 class="empty-title">No favorites yet</h3>
            <p class="empty-text">Tap the heart on any listing to save it here so it's easy to find again.</p>
            <a class="btn-primary" href="browse.html">
              <i data-lucide="search"></i> Browse listings
            </a>
          </div>
        </section>

        <!-- Bottom nav — mobile & tablet only; laptop/desktop use the top nav above -->
        <nav class="bottom-nav" id="bottomNav"></nav>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="js/common.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/currency-data.js"></script>
    <script src="js/analytics-store.js"></script>
    <script src="js/favorites-store.js"></script>
    <script src="js/messages-data.js"></script>
    <script src="js/messages-store.js"></script>
    <script src="js/notifications-data.js"></script>
    <script src="js/notifications-store.js"></script>
    <script src="js/listing-data.js"></script>
    <script src="js/listings-store.js"></script>
    <script src="js/blocked-users-store.js"></script>
    <script src="js/favorites.js"></script>
  </body>
</html>
